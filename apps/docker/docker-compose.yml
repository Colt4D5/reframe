version: '3.9'

services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      - backend

  backend:
    build:
      context: ../..
      dockerfile: apps/docker/api.Dockerfile
    environment:
      PORT: 8080
    expose:
      - "8080"

  proxy:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
